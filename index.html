<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MiniChain – Ứng dụng Blockchain cơ bản</title>
  <meta name="description" content="MiniChain – ứng dụng web mô phỏng blockchain: ví, giao dịch, đào block Proof-of-Work, khám phá chuỗi và kết nối ví MetaMask.">
  <meta name="theme-color" content="#0a0f1d">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%237c8cff'/%3E%3Cg fill='none' stroke='%230a0f1d' stroke-width='2' stroke-linecap='round'%3E%3Crect x='4' y='8' width='6' height='8' rx='1.5'/%3E%3Crect x='14' y='8' width='6' height='8' rx='1.5'/%3E%3Cpath d='M10 12h4'/%3E%3C/g%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css?v=4">
</head>
<body>
  <div class="app">
    <!-- Thanh điều hướng bên trái -->
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="8" height="10" rx="2"/><rect x="14" y="7" width="8" height="10" rx="2"/><path d="M10 12h4"/></svg>
        </div>
        <div class="brand-text">
          <strong>MiniChain</strong>
          <span>Blockchain cơ bản</span>
        </div>
      </div>

      <nav class="nav" id="nav">
        <button class="nav-item active" data-view="dashboard">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
          <span>Tổng quan</span>
        </button>
        <button class="nav-item" data-view="wallets">
          <svg viewBox="0 0 24 24"><path d="M20 7H5a2 2 0 0 1 0-4h13v4"/><path d="M3 5v14a2 2 0 0 0 2 2h15V7"/><circle cx="16" cy="14" r="1.5"/></svg>
          <span>Ví</span>
        </button>
        <button class="nav-item" data-view="transactions">
          <svg viewBox="0 0 24 24"><path d="M7 7h13l-4-4"/><path d="M17 17H4l4 4"/></svg>
          <span>Giao dịch</span>
          <em class="nav-badge" id="badge-pending">0</em>
        </button>
        <button class="nav-item" data-view="mining">
          <svg viewBox="0 0 24 24"><path d="M14 4l6 6"/><path d="M17 7L5 19l-2-2L15 5"/><path d="M12 2c3 0 7 2 9 6"/></svg>
          <span>Đào block</span>
        </button>
        <button class="nav-item" data-view="explorer">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/><path d="M10 6.5h4a3 3 0 0 1 3 3V14"/></svg>
          <span>Khám phá chuỗi</span>
        </button>
        <button class="nav-item" data-view="metamask">
          <svg viewBox="0 0 24 24"><path d="M12 2l8 4v6c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V6z"/><path d="M9 12l2 2 4-4"/></svg>
          <span>Ví MetaMask</span>
          <em class="nav-dot" id="mm-dot"></em>
        </button>
        <button class="nav-item" data-view="guide">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6v.6"/><path d="M12 17h.01"/></svg>
          <span>Hướng dẫn</span>
        </button>
      </nav>

      <div class="sidebar-foot">
        <div class="net-row"><span>Mạng</span><b>MiniChain Testnet</b></div>
        <div class="net-row"><span>Đồng</span><b>MC</b></div>
        <div class="net-row"><span>Thưởng / block</span><b id="foot-reward">50 MC</b></div>
        <div class="net-row"><span>Độ khó mạng</span><b id="foot-diff">3</b></div>
      </div>
    </aside>

    <!-- Nội dung chính -->
    <main class="main">
      <header class="topbar">
        <div>
          <h1 id="page-title">Tổng quan</h1>
          <p id="page-sub"></p>
        </div>
        <div class="top-actions">
          <button id="btn-account" class="btn btn-account" type="button"><span class="lock">🔒</span><span>Đăng nhập ví</span></button>
          <button id="btn-mm" class="btn btn-mm" type="button"><span class="mm-dot"></span>Kết nối MetaMask</button>
          <span id="chain-pill" class="pill"></span>
          <button id="btn-reset" class="btn btn-ghost" title="Xoá dữ liệu và tạo lại chuỗi mẫu">Đặt lại dữ liệu</button>
        </div>
      </header>

      <section id="view" class="view" aria-live="polite"></section>
    </main>
  </div>

  <div id="toasts" class="toasts"></div>

  <script src="js/sha256.js?v=4"></script>
  <script src="js/blockchain.js?v=4"></script>
  <script src="js/metamask.js?v=4"></script>
  <script src="js/app.js?v=4"></script>
</body>
</html>
